# Environment of pyheatmy on its own. Within the MOLONARI-computo tree, the pixi.toml at the root of the tree installs
# pyheatmy together with the other packages.
[workspace]
name = "pyheatmy"
version = "0.12.2"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.10,<3.14"
matplotlib = "*"
scipy = "*"
pandas = "*"
tqdm = "*"
numba = ">=0.60"
psutil = "*"
nbformat = "*"
nbconvert = "*"
ipython = "*"
pytest = "*"
nbmake = "*"
setuptools = "*"

[pypi-dependencies]
pyheatmy = { path = ".", editable = true }

[tasks]
# SemVer of this repository: pixi.toml is the reference, see scripts/bump_version.py
bump-version = "python scripts/bump_version.py"
check-version = "python scripts/bump_version.py --check"
test = "pytest tests"

# the oldest and the newest Python of the environment, tested on GitHub Actions
[feature.py310.dependencies]
python = "3.10.*"

[feature.py313.dependencies]
python = "3.13.*"

[environments]
py310 = ["py310"]
py313 = ["py313"]
