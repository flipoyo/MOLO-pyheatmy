# Runs the tests of pyheatmy on every push and pull request, in the pixi environments of this repository: py310 and
# py313, the oldest and the newest Python supported. pyheatmy does not import bayesian_inversion, so it is installed alone; the
# two packages are used together in the MOLONARI-computo tree (pixi run test-all at the root of the tree).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [py310, py313]
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.66.0
          environments: ${{ matrix.environment }}
          locked: true
      - name: Check that every file holds the version of pixi.toml
        run: pixi run -e ${{ matrix.environment }} check-version
      - name: Run the tests
        run: pixi run -e ${{ matrix.environment }} test
